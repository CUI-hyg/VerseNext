[package]
name = "verse_rs"
version = "0.1.0"
edition = "2021"
description = "VerseTorch Part1 Rust 内核（parallel 等 CPU 数值热点）"
license = "MIT"

[lib]
name = "verse_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
rayon = "1.10"
matrixmultiply = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
