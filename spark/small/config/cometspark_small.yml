# CometSpark Small（0.06zB 目标）VMPC-small 预设（Part5K1.5 升级）
#
# 双模型并行中的 small 档：0.06zB 小模型（1zB ≈ 1000B 等效能力）。
# 用于 3 核 CPU / 5GB 内存沙箱下快速跑通端到端流程（训练 / 生成 / 压缩 / 打分）。
#
# Part5K1.5 升级要点：
# - seq_len=150, n_layer=8（大幅提升模型容量）
# - mod_every=1（强制每层都是 MoD，全 MoD 架构）
# - num_dense_parts=4, num_experts_per_part=4, top_k=2（增强路由能力）
# - KV Cache 优化：max_position_embeddings=256（够用即可，减少预计算开销）
# - 训练 Steps 优化：max_steps=300, eval_interval=30（匹配更深模型）
#
# VMPC-small 预设：
# - ternary 量化（2bit/值，高压缩比）+ 高稀疏剪枝（sparsity=0.5）
# - use_lora=false：不包装 LoRA（小模型无需微调适配器）
# - distill=false：不蒸馏（无 teacher 模型）
#
# checkpoint.save_dir=mf_small（Task 10 会用）

model:
  arch: versenex
  vocab_size: 256
  n_layer: 8
  n_embd: 128
  n_head: 8
  n_kv_head: 4
  seq_len: 150
  dropout: 0.0
  tie_weights: true

  # VerseNex / MoD（Part5K1.5：全 MoD 架构 + 增强路由）
  mod_every: 1              # 强制每层都是 MoD
  num_dense_parts: 4        # 4 个 DensePart（通用/语言/数理/代码）
  num_experts_per_part: 4   # 每个 DensePart 4 个 Expert
  top_k: 2                  # 每个 token 激活 2 个 Expert
  expert_hidden: null
  window_size: 64
  num_global_tokens: 8
  use_alibi: true
  use_rope: false
  rope_theta: 10000.0
  max_position_embeddings: 256   # KV Cache 优化：够用即可
  aux_loss_weight: 0.01

  # tokenizer（调试用 byte，无网络）
  tokenizer_repo: Qwen/Qwen3.5-35B-A3B

  # VerseNex 优化（解决胡乱输出）
  embedding_scale: true
  temperature_scaling: 1.0
  # small 用更高 init_std，加速小模型收敛
  init_std: 0.04

  # 训练 / 设备
  device: cpu
  parallel_chunks: 1

# VMPC V2.0 配置（Part5K1.1：use_vmpc 统一开关 + VSC 参数）
vmpc:
  # Part5K1.1: VMPC V2.0 统一开关（默认开启）
  # use_vmpc=true 时：强制 *.vn 格式 + VSC 引擎压缩 + 训练/推理自动接入
  # use_vmpc=false 时：走 legacy 模式（传统技术直通）
  use_vmpc: true

  # legacy 字段（use_vmpc=false 时生效，兼容旧配置）
  profile: small
  prune_sparsity: 0.5
  quantize_dtype: ternary
  use_lora: false
  distill: false

  # Part5K1.1: V2.0 专属参数（VSC 三维空间压缩配置）
  # 物理压缩占 40%（量化+剪枝），算法优化占 60%（路由稀疏+算子融合+训练补偿）
  target_ratio: 0.06       # 压到原大小 6%（0.06zB 目标）
  quantize_bits: 2         # ternary 量化（2bit/值）
  storage_weight: 0.5      # 存储维度权重（小模型存储优先）
  compute_weight: 0.3      # 算力维度权重
  time_weight: 0.2         # 时间维度权重
  force_vn_format: true    # use_vmpc=true 时强制 .vn 格式
  enable_compensation: true # 启用训练补偿（恢复压缩损失的能力）

training:
  batch_size: 8
  micro_batch: 4
  lr: 0.003
  weight_decay: 0.01
  no_decay: true
  grad_clip: 1.0
  label_smoothing: 0.1
  max_steps: 300           # Part5K1.5：匹配 8 层模型，适当增加步数
  warmup: 30               # Part5K1.5：匹配更深模型
  eval_interval: 30        # Part5K1.5：匹配 max_steps
  patience: 5
  grad_accum: 1
  log_interval: 10
  seed: 42
  enable_progress_bar: true
  realtime_plot: true
  eta_window: 20
  parallel_chunks: 1

tokenizer:
  # Part5K1.3 Task 8.1: 默认 gigatoken（高速 Tokenizer）
  # 未安装 gigatoken 时，bpe.load_tokenizer(kind="giga") 会自动降级到 VerseTokenizer
  # （打印降级警告），保持向后兼容。需要 BPE 调试时显式改回 "byte"。
  kind: giga
  vocab_size: 259

data:
  train_path: ../data/train.jsonl
  val_path: ../data/val.jsonl

checkpoint:
  save_dir: mf_small
