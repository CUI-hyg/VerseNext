# CometSpark-Exp-0.2 核心配置
# 与 verse_trainer.trainer.TrainerConfig 字段对齐，可被 run.py 直接加载。
# 词表大小必须覆盖 tokenizer/tokenizer.json 的最大 token id (248076)。
#
# 相对 0.1 的变化：
# - 参数量约 35M -> 73M（d_model 128 -> 256，权重绑定下 embedding 占大头）
# - GQA：8 个 Q 头共享 2 个 KV 头（KV 缓存减至 1/4）
# - DSA 稀疏注意力：indexer 打分 + top-k 选择，解码 FLOPs 从 O(total) 降
#   至 O(top_k)；训练期附带索引器辅助损失（dsa_index_loss_weight）保证
#   indexer 得到梯度
# - max_seq_len 256 -> 512（DSA 在长上下文下收益更大）

model_name: cometspark

model:
  vocab_size: 248077
  d_model: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 2         # GQA
  ffn_hidden_dim: null    # null = 自动 8/3*d_model 对齐 256
  max_seq_len: 512
  dropout: 0.0
  tie_weights: true
  gradient_checkpointing: false
  attn_type: dsa
  dsa_index_head_dim: 32
  dsa_top_k: 64
  dsa_index_loss_weight: 0.1

data:
  batch_size: 2
  seq_len: 160            # 更长窗口让 DSA 的 top-k 选择有意义（64/128）
  seed: 42
  drop_last: true

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 450
  max_steps: 300          # 与 steps 对齐（余弦衰减地平线）
  min_lr_ratio: 0.1

steps: 300
log_every: 10
eval_every: 100
eval_batches: 20
ckpt_dir: checkpoints
ckpt_every: 100          # 每 100 步保存周期 checkpoint（save_best_only 时仅更优才存）
loss_plot: true          # 训练结束绘制 loss 曲线 -> checkpoints/loss_curve.png
save_best_only: true     # 智能保存：监控 loss 创新低才保存 checkpoint
early_stop_patience: 5   # 连续 5 次评估 loss 未降低则提前停止
device: auto
dtype: auto
compile: false
grad_accum_steps: 4
num_threads: 8          # 实测 8 线程吞吐最优（362 tok/s，较 4 线程 +13%）
seed: 48