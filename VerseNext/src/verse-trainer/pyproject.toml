[project]
name = "verse-trainer"
version = "0.1.0"
description = "VerseNext 训练优化：AMP / 梯度累积 / torch.compile / checkpoint"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "verse-core", "verse-nn", "verse-tokenizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verse_trainer"]
