[project]
name = "verse-cli"
version = "0.1.0"
description = "VerseNext 命令行入口：verse train / evolve / bench"
requires-python = ">=3.10"
dependencies = ["verse-core", "verse-nn", "verse-trainer", "verse-rsi", "verse-tokenizer"]

[project.scripts]
verse = "verse_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verse_cli"]
