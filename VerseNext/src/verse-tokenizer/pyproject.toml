[project]
name = "verse-tokenizer"
version = "0.1.0"
description = "VerseNext 分词器：byte-level BPE + chat_template.jinja 支持"
requires-python = ">=3.10"
dependencies = ["verse-core", "jinja2>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verse_tokenizer"]

[tool.hatch.build.targets.wheel.force-include]
"verse_tokenizer/chat_templates" = "verse_tokenizer/chat_templates"
