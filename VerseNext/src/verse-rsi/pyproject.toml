[project]
name = "verse-rsi"
version = "0.1.0"
description = "VerseNext RSI 递归自进化：评估 / 变异 / 种群 / 进化循环"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "verse-core", "verse-nn", "verse-trainer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verse_rsi"]
