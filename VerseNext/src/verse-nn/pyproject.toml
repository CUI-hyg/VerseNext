[project]
name = "verse-nn"
version = "0.1.0"
description = "VerseNext 模型架构：SDPA attention / RoPE / SwiGLU / Transformer"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "verse-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verse_nn"]
